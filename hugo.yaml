baseurl: https://rikka.im
locale: zh-cn
theme: hugo-theme-stack
title: Rikkaの小小窝
copyright: Shiina Rikka
pagination:
    pagerSize: 8

enableGitInfo: true

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
    zh-cn:
        label: 中文
        title: Rikkaの小小窝
        weight: 2
        params:
            description: 早上好哦(つω`*)～☆

permalinks:
    post: /post/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    rssFullContent: true
    favicon: img/favicon.ico

    footer:
        since: 2024
        customText: <a href="https://icp.gov.moe/?keyword=20240925" target="_blank">萌ICP备20240925号</a>

    dateFormat:
        published: 2006-01-02
        lastUpdated: 2006-01-02 15:04 MST

    sidebar:
        emoji: 😺
        subtitle: Eclipse first, the rest nowhere.
        avatar: img/avatar.webp

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: twikoo

        twikoo:
            envId: https://twikoo.rikka.im
            region:
            path:
            lang: zh-CN

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        autoOrient: false
        external:
            timeout: 5s
        content:
            enabled: true
            widths: [800, 1600, 2400]
        thumbnail:
            enabled: true

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: 
        - identifier: home
          name: 主页
          url: /
          weight: 1
          params:
              icon: home
        
        - identifier: categories
          name: 分类
          url: /categories
          weight: 2
          params:
              newTab: false
              icon: categories
        
        - identifier: travelling
          name: 开往
          url: https://www.travellings.cn/go.html
          weight: 20
          params:
              newTab: true
              icon: train

    social:
        - identifier: mail
          name: Mail
          url: mailto:rikka@rikka.im
          weight: 1
          params:
              icon: mail

        - identifier: telegram
          name: Telegram
          url: https://t.me/RikkaNekoo
          weight: 3
          params:
              icon: brand-telegram

        - identifier: github
          name: GitHub
          url: https://github.com/RikkaNekoo
          weight: 2
          params:
              icon: brand-github

        - identifier: twitter
          name: Twitter
          url: https://twitter.com/RikkaNekoo
          weight: 3
          params:
              icon: brand-twitter
        
        - identifier: rss
          name: RSS
          url: https://rikka.im/index.xml
          weight: 4
          params:
              icon: rss 

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4

frontmatter:
  lastmod: ['lastmod', ':git', 'date', 'publishDate']
